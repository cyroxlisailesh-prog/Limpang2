<!DOCTYPE html>
<html lang="en">
<head>

    <title>Happy Birthday ❤️</title>
  <>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
    </head>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 25px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            display: none;
            margin-top: 25px;
        }

        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 25px;
            animation: float 5s linear forwards;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    
</style>

<body>

<div class="container">

    <div class="card">

        <h1>🎂 Happy Birthday Alina❤️</h1>

        <h2>To My Beautiful Love 💕</h2>

        <p>
            Today is a very special day because it's the birthday
            of the person who makes my world more beautiful. ❤️
        </p>

        <button onclick="showMessage()">
            Click Me ❤️
        </button>

        <div id="message">
            <h2>I Love You So Much 0.5❤️</h2>

            <p>
                May your birthday be as beautiful and special
                as you are to me. 💕
            </p>

            <p>
                Happy Birthday, Baby! 🎂🎉❤️
            </p>
        </div>

    </div>

</div>

<script>

function showMessage() {

    document.getElementById("message").style.display = "block";

    for (let i = 0; i < 30; i++) {
        createHeart();
    }
}

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

</script>
  <script src="script.js"></script>

</body>
</html>
